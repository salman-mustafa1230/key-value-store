name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: keystore_test
          POSTGRES_USER: keystore
          POSTGRES_PASSWORD: keystore
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U keystore -d keystore_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, pgsql
          coverage: pcov
          tools: composer:v2

      - run: composer install --prefer-dist --no-interaction

      - run: cp .env.example .env && php artisan key:generate

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          php artisan test --coverage --coverage-clover=coverage/clover.xml --coverage-html=coverage/html

      - name: Coverage summary
        if: always()
        run: |
          php -r '
          $file = "coverage/clover.xml";
          if (!is_file($file)) {
              fwrite(STDERR, "No clover.xml; skipping coverage summary.\n");
              exit(0);
          }
          $xml = simplexml_load_file($file);
          if ($xml === false) {
              fwrite(STDERR, "Could not parse clover.xml.\n");
              exit(1);
          }
          $metrics = $xml->project->metrics ?? $xml->metrics;
          if ($metrics === null) {
              fwrite(STDERR, "clover.xml has no project metrics.\n");
              exit(1);
          }
          $covered = (int) $metrics["coveredstatements"];
          $total = (int) $metrics["statements"];
          $pct = $total === 0 ? 0.0 : round(100 * $covered / $total, 2);
          $line = sprintf("**%s%%** (%d / %d statements)", $pct, $covered, $total);
          echo "Coverage: {$pct}% ({$covered}/{$total} statements)\n";
          $summary = getenv("GITHUB_STEP_SUMMARY");
          if (is_string($summary) && $summary !== "") {
              file_put_contents($summary, "## Code coverage\n\n{$line}\n\nHTML report is the **coverage-report** artifact on this run.\n", FILE_APPEND);
          }
          '

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: |
            coverage/html
            coverage/clover.xml
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Composer audit
        run: composer audit --locked

      - name: Trivy (vulnerabilities and secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          skip-dirs: vendor,node_modules,storage
          format: table

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:actions"

  docker:
    name: Build image
    needs: [test, security, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: keystore:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
